name: Verify release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: revenue_costs_test
          POSTGRES_PASSWORD: revenue_costs_test
          POSTGRES_DB: revenue_and_costs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenue_costs_test -d revenue_and_costs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://revenue_costs_test:revenue_costs_test@127.0.0.1:5432/revenue_and_costs_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:release
